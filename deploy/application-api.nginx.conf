# Include inside nginx's http block. Terminate HTTPS at the trusted load balancer
# in front of this listener, or add site-specific TLS configuration here.
server {
    listen 8080;
    server_name _;
    # 128000 CJK chars can exceed 384 KB of UTF-8, so keep headroom above the
    # documented message budget (docs/application_api.md) instead of rejecting
    # a valid payload with 413 before it reaches the app.
    client_max_body_size 1m;
    client_body_timeout 15s;
    access_log off;

    location ~ ^(/api/v1/runtime/apps/[A-Za-z0-9-]+/(chat|runs/[A-Za-z0-9-]+)|/v1/(chat/completions|models(/[A-Za-z0-9-]+)?))$ {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location / { return 404; }
}
