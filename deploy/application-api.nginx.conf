# Include inside nginx's http block. Terminate HTTPS at the trusted load balancer
# in front of this listener, or add site-specific TLS configuration here.
# nginx error messages can include the original request line (and query tokens).
# Apply this at http scope too, before a malformed request selects a server.
# Application path-only request metrics remain available in the API process.
error_log /dev/null crit;

# Match method and normalized path together. Quoting keeps UUID repetition
# braces inside regex arguments rather than nginx configuration blocks.
map "$request_method:$uri" $nianlun_public_api_allowed {
    default 0;
    "~^(POST|OPTIONS):/api/v1/runtime/apps/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/chat$" 1;
    "~^(GET|OPTIONS):/api/v1/runtime/apps/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/runs/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" 1;
    "~^(GET|OPTIONS):/api/v1/runtime/images/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" 1;
    "~^(POST|OPTIONS):/api/v1/runtime/apps/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/runs/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/images/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/access$" 1;
    "~^(POST|OPTIONS):/v1/chat/completions$" 1;
    "~^(GET|OPTIONS):/v1/models$" 1;
    "~^(GET|OPTIONS):/v1/models/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" 1;
}

server {
    listen 8080 default_server;
    server_name _;
    # 128000 CJK chars can exceed 384 KB of UTF-8, so keep headroom above the
    # documented message budget (docs/application_api.md) instead of rejecting
    # a valid payload with 413 before it reaches the app.
    client_max_body_size 1m;
    client_body_timeout 15s;
    access_log off;
    error_log /dev/null crit;

    if ($nianlun_public_api_allowed = 0) { return 404; }

    # OPTIONS reaches application CORS validation only on an allowed path.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

}
